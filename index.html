<meta name="theme-color" content="#6366f1">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="StudyOS">
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mut:#667085;--bd:#e4e7ee;--ac:#4f46e5;--ac2:#eef0ff;--ok:#16a34a;--warn:#d97706;--bad:#dc2626}
[data-theme=dark]{--bg:#0f1220;--card:#181c2e;--tx:#eceefb;--mut:#9aa3c0;--bd:#2a3050;--ac:#8b86ff;--ac2:#232850;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171}
*{box-sizing:border-box}
body{margin:0;font:var(--fs,15px)/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
#app{max-width:900px;margin:0 auto;padding:12px 12px 90px}
header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
header h1{font-size:18px;margin:0;flex:1}
h2{font-size:16px;margin:18px 0 8px}
h3{font-size:15px;margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.mut{color:var(--mut);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:var(--ac2);color:var(--ac)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:8px 10px;max-width:100%}
input[type=number]{width:90px}
input[type=text],input[type=date],textarea{width:100%}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--ac2);color:var(--ac)}
.chip.ok{background:#16a34a22;color:var(--ok)}.chip.warn{background:#d9770622;color:var(--warn)}.chip.bad{background:#dc262622;color:var(--bad)}
.bar{height:8px;border-radius:99px;background:var(--bd);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ac)}
.blk{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}
.blk:first-of-type{border-top:0}
.blk .r{display:flex;gap:8px;align-items:center;white-space:nowrap}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:center;z-index:5}
nav button{flex:1;max-width:150px;background:none;border:0;padding:10px 4px 12px;font:inherit;font-size:12px;color:var(--mut);cursor:pointer}
nav button.on{color:var(--ac);font-weight:700}
nav button b{display:block;font-size:18px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd);vertical-align:top}
.scroll{overflow-x:auto}
.ov{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal{background:var(--card);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:16px;max-height:90vh;overflow:auto}
@media(min-width:600px){.ov{align-items:center}.modal{border-radius:16px}}
.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:#111;color:#fff;padding:9px 14px;border-radius:10px;z-index:30;font-size:14px;max-width:90%}
.opt{display:flex;gap:10px;flex-wrap:wrap}
.opt label{margin:0;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;color:var(--tx);cursor:pointer;display:flex;gap:6px;align-items:center}
.ch{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px 0;border-top:1px solid var(--bd)}
.ch .nm{flex:1;min-width:120px}
.warnbox{background:#d9770618;border:1px solid var(--warn);border-radius:10px;padding:10px;font-size:13px;margin-bottom:12px}
</style>
</head>

 marks per paper (used to find weak papers)": "Har paper ka target marks (weak paper dhoondhne ke liye)", "Groups you are preparing for": "Jin groups ki taiyari kar rahe ho", "A chapter can be ticked only after studying it with the timer": "Chapter tabhi tick hoga jab timer ke saath padha ho", "Level: CA Intermediate (when you pass it, the next level opens by itself on the Today tab)": "Level: CA Intermediate (pass karte hi agla level Aaj tab par khud khul jayega)", "Language": "Bhasha", "Daily reminder": "Roz ka reminder", "Download reminder": "Reminder download karo", "Adds a repeating study reminder to your phone calendar. Open the downloaded file and choose your calendar app.": "Phone calendar me roz repeat hone wala study reminder jodta hai. Download hui file kholo aur apna calendar app chuno.", "Share this app": "Ye app share karo", "Share app link": "App link share karo", "Send the link to friends. Each person signs up with their own email and gets their own plan.": "Link dosto ko bhejo. Har koi apne email se sign up karke apna plan paata hai.", "Backup": "Backup", "Export backup": "Backup export karo", "Import backup": "Backup import karo", "Your data lives only in this browser. Export a backup file regularly and keep it safe. Importing adds profiles; it never overwrites existing ones.": "Aapka data sirf is browser me hai. Backup file regular export karke surakshit rakho. Import se profiles add hote hain, purane overwrite nahi hote.", "Danger zone": "Khatre ka zone", "Delete this profile": "Ye profile delete karo", "Cloud account (sync + Partner)": "Cloud account (sync + Partner)", "Sync now": "Abhi sync karo", "Sign out": "Sign out", "Disconnect": "Disconnect", "ICAI dates": "ICAI dates", "ICAI dates (admin)": "ICAI dates (admin)", "Check ICAI now": "Abhi ICAI check karo", "Read dates from this text": "Is text se dates padho", "No dates waiting for approval.": "Approval ke liye koi date nahi ruki.", "Following the ICAI schedule automatically.": "ICAI schedule apne aap follow ho raha hai.", "Exam form:": "Exam form:", "Always confirm on icai.org before acting.": "Kuch karne se pehle icai.org par confirm zaroor karo.", "Set from the ICAI schedule (first paper of your group). It will update by itself if ICAI changes it.": "ICAI schedule se set hua (aapke group ka pehla paper). ICAI badle to khud update hoga.", "ICAI has not announced this attempt yet, so this is an estimate. The app will fix it by itself when the date is published.": "ICAI ne ye attempt abhi announce nahi kiya, isliye ye anumaan hai. Date aate hi app khud theek kar dega.", "ICAI has not published the Sep 2026 schedule in this app yet. Your exam date is an estimate and will be corrected automatically when it is added.": "ICAI ka Sep 2026 schedule abhi is app me nahi hai. Exam date anumaan hai, add hote hi apne aap sahi ho jayegi.", "Sign in to your cloud account first (Settings → Cloud account). The AI runs on your own Supabase project, so no key is ever kept in this page.": "Pehle cloud account me sign in karo (Settings → Cloud account). AI aapke apne Supabase project par chalta hai, isliye is page me koi key nahi rakhi jati.", "Go to Settings": "Settings par jao", "My CA journey": "Meri CA journey", "You are here": "Aap yahan ho", "Skipped (direct entry)": "Skip (direct entry)", "Locked until both Intermediate groups are passed": "Intermediate ke dono groups pass hone tak locked", "Open": "Kholo", "Not on this level? Tap ＋ at the top and choose your level. Intermediate opens only after Foundation is passed, or by direct entry for graduates. Final opens after both Intermediate groups.": "Is level par nahi ho? Upar ＋ dabao aur apna level chuno. Intermediate Foundation pass hone ke baad hi khulta hai, ya graduates ke liye direct entry se. Final dono Intermediate groups ke baad.", "Earlier-level marks help the plan: related subjects you scored low in get more hours.": "Pichle level ke marks plan ki madad karte hain: jin related subjects me kam marks aaye unko zyada ghante milte hain.", "Show chapters": "Chapters dikhao", "Focus paper": "Focus paper", "Hours needed": "Zaroori ghante", "Each unit or accounting standard is ticked on its own. Ticking schedules its revisions.": "Har unit ya accounting standard alag se tick hota hai. Tick karte hi uske revisions lag jate hain.", "Default hours are rough estimates: edit them to match your lecture hours. Starter chapter list compiled in Oct 2026 from public sources (Physics Wallah, Careers360, CA Test Series). It is not an official ICAI document. Check it against the ICAI syllabus and your study material. Final Paper 6 (Integrated Business Solutions) is a case-study paper with no fixed chapter list.": "Default ghante mote anumaan hain: apne lecture ke ghanton ke hisaab se badlo. Chapter list Oct 2026 me public sources se bani hai (Physics Wallah, Careers360, CA Test Series). Ye ICAI ka official document nahi hai. ICAI syllabus aur apne study material se milakar dekho. Final Paper 6 (Integrated Business Solutions) case-study paper hai, iski fixed chapter list nahi hai.", "AI tutor": "AI tutor", "What do you want?": "Aapko kya chahiye?", "Answer my doubt": "Meri doubt ka jawab do", "Explain a topic": "Ek topic samjhao", "Give me practice questions": "Practice questions do", "Suggest how to study this week": "Is hafte kaise padhna hai batao", "Answer only from text I paste (from my material)": "Sirf meri paste ki hui text se jawab do (mere material se)", "Your question or topic": "Aapka sawal ya topic", "Ask a doubt, get a topic explained, or get 5 practice questions. Up to 30 a day. Answers can be wrong: check important points in ICAI material.": "Doubt pucho, topic samjhao, ya 5 practice questions lo. Roz 30 tak. Jawab galat ho sakte hain: zaroori baatein ICAI material se check karo.", "Paste text from your study material (up to 6000 characters)": "Apne study material se text paste karo (6000 akshar tak)", "The AI will use only this text. If the answer is not in it, it will say so.": "AI sirf isi text ka use karega. Jawab isme na ho to wo bata dega.", "Ask": "Pucho", "Sign in": "Sign in", "Create account": "Account banao", "Signed in as": "Sign in hai:", "Signed in": "Sign in ho gaya", "Password (min 6 characters)": "Password (kam se kam 6 akshar)", "Not admin": "Admin nahi", "You are the admin": "Aap admin ho", "Changes sync automatically a few seconds after you make them. If you are offline, they are kept and sent later.": "Badlav kuch second baad apne aap sync ho jate hain. Offline ho to save rehte hain aur baad me bhej diye jate hain.", "Partner features need the free cloud account. Setting it up takes about 10 minutes, once.": "Partner features ke liye free cloud account chahiye. Setup me ek baar lagbhag 10 minute lagte hain.", "Open cloud setup": "Cloud setup kholo", "Invite a partner or friend": "Partner ya dost ko invite karo", "Send invite": "Invite bhejo", "Invitation sent, waiting for a reply": "Invite bhej diya, jawab ka intezaar", "They need their own account (same app link). The invite shows up in their Partner tab.": "Unka apna account chahiye (wahi app link). Invite unke Partner tab me dikhega.", "If you accept, you can each choose what to share. Nothing is shared until you switch it on.": "Accept karoge to dono chun sakte ho kya share karna hai. Jab tak switch on na karo kuch share nahi hota.", "Your partner": "Aapka partner", "Open Partner": "Partner kholo", "Leaderboard (last 7 days)": "Leaderboard (pichle 7 din)", "Shared goals": "Shared goals", "New shared goal": "Naya shared goal", "No shared goals yet.": "Abhi koi shared goal nahi.", "No connections yet.": "Abhi koi connection nahi.", "Profile you share with your partner": "Jo profile partner ke saath share karte ho", "What you share with them": "Aap unke saath kya share karte ho", "Sharing on": "Sharing on", "Sharing off": "Sharing off", "Overall progress": "Kul progress", "Subject-wise progress": "Subject ke hisaab se progress", "Chapter completion": "Chapter completion", "Study goals": "Study goals", "Study time and streaks": "Study time aur streaks", "Test and attempt results": "Test aur attempt ke results", "Revision status": "Revision status", "Shown automatically. Notes, mistakes and pending work are never shared.": "Apne aap dikhta hai. Notes, galtiyan aur baki kaam kabhi share nahi hote.", "Your partner only sees what you switch on for her below. Notes, mistakes, pending work and anything private are never shared.": "Partner sirf wahi dekhta hai jo aap neeche on karte ho. Notes, galtiyan, baki kaam aur private cheezein kabhi share nahi hoti.", "You are not sharing anything right now, so they cannot see your progress.": "Abhi aap kuch share nahi kar rahe, isliye wo aapki progress nahi dekh sakte.", "Nothing is shared yet. Ask them to open the app once so it syncs.": "Abhi kuch share nahi hua. Unse kaho app ek baar khole taaki sync ho.", "Compares study hours with everyone connected to you who has switched on “Study time and streaks”.": "Un sabke saath study hours compare karta hai jo aapse jude hain aur jinhone “Study time aur streaks” on kiya hai.", "Study hours (automatic)": "Study hours (automatic)", "Chapters completed (automatic)": "Chapters complete (automatic)", "Chapters completed": "Chapters complete", "Your number updates automatically from your logged": "Aapka number aapke log kiye hue se apne aap update hota hai", "Most time on:": "Sabse zyada time:", "Study this week:": "Is hafte padhai:", "Share this report": "Ye report share karo", "Weekly report": "Weekly report", "Study time": "Study time", "Mock tests": "Mock tests", "Mock tests:": "Mock tests:", "Chapters / units finished": "Chapters / units khatam", "Chapters/units finished:": "Chapters/units khatam:", "Last 6 weeks (hours logged vs weekly goal)": "Pichle 6 hafte (log ghante vs weekly goal)", "Study streak:": "Study streak:", "Syllabus hours covered": "Syllabus ke ghante poore", "Syllabus hours covered:": "Syllabus ke ghante poore:", "Fix these first": "Pehle inhe theek karo", "Based on your confidence ratings and the mistakes you note after sessions.": "Aapki confidence ratings aur session ke baad likhi galtiyon ke aadhar par.", "Weak chapters:": "Weak chapters:", "Weakest now:": "Abhi sabse kamzor:", "Getting started": "Shuruaat", "Got it, hide this": "Samajh gaya, ise chhupao", "2. Check chapters in": "2. Chapters check karo:", "3. Each day open": "3. Roz kholo:", "4. Add mock scores in": "4. Mock scores add karo:", "5. Install the app: browser menu → Install app.": "5. App install karo: browser menu → Install app.", "Show all": "Sab dikhao", "Show fewer weeks": "Kam hafte dikhao", "Hide chapters": "Chapters chhupao", "Add your own chapters (one per line)": "Apne chapters add karo (har line me ek)", "No chapter list for this paper. Add your own below.": "Is paper ki chapter list nahi hai. Neeche apne add karo.", "This is a case-study paper with no fixed chapter list. Add your own practice sets if you want to track them.": "Ye case-study paper hai, iski fixed chapter list nahi. Track karna ho to apne practice sets add karo.", "No study blocks today.": "Aaj koi study block nahi.", "Today is your rest day. Optional: 20 minutes of light revision.": "Aaj aapka rest day hai. Chaho to 20 minute halka revision karo.", "Nothing left to study for the selected group(s): they are passed or fully exempt. Change groups in Settings if you start another group.": "Chune hue group(s) me padhne ko kuch nahi bacha: pass hain ya poori exemption hai. Doosra group shuru karo to Settings me group badlo.", "This group is passed. No need to study it again.": "Ye group pass ho chuka hai. Dobara padhne ki zaroorat nahi.", "Timed mock / PYQ paper": "Timed mock / PYQ paper", "Revise + practice": "Revise + practice", "Practice / PYQs": "Practice / PYQs", "Revision only": "Sirf revision", "Study": "Padhai", "Revision": "Revision", "Course finished: revise and solve PYQs": "Course khatam: revise karo aur PYQs solve karo", "Write under exam conditions, then review every mistake": "Exam jaise halat me likho, phir har galti review karo", "Maintenance (course finished, scored 60+)": "Maintenance (course khatam, 60+ aaye)", "Revision only (course finished)": "Sirf revision (course khatam)", "One light revision pass a week and a few PYQs.": "Hafte me ek halka revision aur thode PYQs.", "Two revision passes, then PYQs and a timed paper.": "Do revision, phir PYQs aur ek timed paper.", "Finish the syllabus first, then revise.": "Pehle syllabus khatam karo, phir revise karo.", "Syllabus update available": "Syllabus update available", "Apply update": "Update lagao", "Your ticks and progress are kept. Chapters you already started are never deleted.": "Aapke tick aur progress bache rehte hain. Jo chapters shuru kar chuke ho wo kabhi delete nahi hote.", "Removed by ICAI": "ICAI ne hataya", "Exam form last date:": "Exam form ki last date:", "Confirm on icai.org before registering.": "Register karne se pehle icai.org par confirm karo.", "Check these on icai.org before approving.": "Approve karne se pehle ye icai.org par check karo.", "Use ICAI date": "ICAI date use karo", "ICAI date is": "ICAI date hai", "Set by you.": "Aapne set ki.", "You chose this date yourself, so it will not change automatically.": "Ye date aapne khud chuni, isliye apne aap nahi badlegi.", "Estimate. Will be corrected automatically when ICAI publishes the date.": "Anumaan. ICAI date publish karte hi apne aap sahi ho jayegi.", "Your browser is blocking saving. Data will be lost when you close this page. Use Settings → Export backup often.": "Aapka browser saving block kar raha hai. Page band karte hi data chala jayega. Settings → Export backup baar baar karo.", "It is tight but possible. Missing days will push you behind, so protect your study time.": "Tight hai par ho sakta hai. Din chhootne se peeche ho jaoge, isliye study time bachao.", "Focus on revision, past papers and your weak chapters. Do not start big new topics now.": "Revision, purane papers aur weak chapters par dhyan do. Ab bade naye topics shuru mat karo.", "Foundation: this app does not apply any paper exemption. You pass with 40% in every paper and 50% overall. Check the latest ICAI rules.": "Foundation me ye app koi paper exemption nahi lagata. Har paper me 40% aur total 50% par pass. Latest ICAI rules check karo.", "Congratulations. You have passed both groups of CA Final.": "Badhai ho. Aapne CA Final ke dono groups pass kar liye.", "CA Final cleared": "CA Final clear", "Final is open.": "Final khul gaya.", "Not recorded": "Record nahi", "Locked until Foundation is passed": "Foundation pass hone tak locked", "Qualified CA/CS/CMA: eligible for direct entry.": "CA/CS/CMA qualified: direct entry ke yogya.", "Commerce graduates need at least 55%. Foundation route is the way.": "Commerce graduates ko kam se kam 55% chahiye. Foundation wala raasta lo.", "Other graduates need at least 60%. Foundation route is the way.": "Doosre graduates ko kam se kam 60% chahiye. Foundation wala raasta lo.", "Direct entry needs a graduation/PG degree (or CS/CMA). Otherwise start with Foundation.": "Direct entry ke liye graduation/PG degree (ya CS/CMA) chahiye. Nahi to Foundation se shuru karo.", "Not now": "Abhi nahi", "Save and connect": "Save karo aur connect karo", "Project URL": "Project URL", "Anon / publishable key": "Anon / publishable key", "Plan created": "Plan ban gaya", "Settings saved": "Settings save ho gayi", "Session saved": "Session save ho gaya", "Result saved": "Result save ho gaya", "Score added": "Score add ho gaya", "Saved": "Save ho gaya", "Revision done": "Revision ho gaya", "Moved to tomorrow, confidence lowered": "Kal par shift, confidence kam kiya", "Revisions scheduled automatically": "Revisions apne aap lag gaye", "Pick at least one group": "Kam se kam ek group chuno", "Choose the exam date": "Exam date chuno", "Daily hours must be between 1 and 14": "Roz ke ghante 1 se 14 ke beech hone chahiye", "Marks must be between 0 and 100": tart OFF. Notes, mistakes and anything private are never shared.": "Sirf wahi jo aap Partner tab me on karo. Sab switch pehle OFF hote hain. Notes, galtiyan aur private cheezein kabhi share nahi hoti.", "Where is my data kept?": "Mera data kahan rehta hai?", "On this phone or browser. If you sign in to the cloud account, a copy is also saved there so you can use another device. Back up regularly.": "Is phone ya browser me. Cloud account me sign in karo to ek copy wahan bhi save hoti hai taaki dusre device par chala sako. Backup regular karo.", "How do I get reminders?": "Reminder kaise aayenge?", "Settings, then Notifications, then turn them on. On iPhone, first add the app to your Home Screen.": "Settings me Notifications me jao aur chalu karo. iPhone par pehle app ko Home Screen par add karo.", "About and privacy": "App ke baare me aur privacy", "CA StudyOS is a free study planner for CA Foundation, Intermediate and Final. It is not an ICAI product. Chapter lists and exam dates can be wrong, so always confirm on icai.org.": "CA StudyOS CA Foundation, Intermediate aur Final ke liye free study planner hai. Ye ICAI ka product nahi hai. Chapter list aur exam dates galat ho sakti hain, isliye icai.org par zaroor confirm karo.", "We do not sell or show your data to anyone. Your study data stays on your device unless you sign in. If you share with a partner or a group, only the items you switch on are visible.": "Hum aapka data kisi ko bechte ya dikhate nahi. Sign in na karo to padhai ka data aapke device par hi rehta hai. Partner ya group ke saath share karo to sirf wahi cheezein dikhti hain jo aap on karo.", "Report a problem": "Problem batao", "Something not working? Copy a short report and send it to the person who gave you this app.": "Kuch kaam nahi kar raha? Ek chhoti report copy karo aur jisne ye app diya use bhej do.", "Copy problem report": "Problem report copy karo", "Copied. Send it with a screenshot.": "Copy ho gaya. Screenshot ke saath bhejo.", "Install the app": "App install karo", "Opens like a normal app, works offline and can send reminders.": "Normal app ki tarah khulta hai, offline chalta hai aur reminder bhej sakta hai.", "Install": "Install karo", "Text size": "Text ka size", "Normal": "Normal", "Large": "Bada", "ICAI updates": "ICAI ke updates", "For your level and the levels just below and above it.": "Aapke level aur uske ek neeche-upar ke levels ke liye.", "CA Foundation September 2026 result": "CA Foundation September 2026 ka result", "Reported date: 6 Nov 2026. Check caresults.icai.org on the day.": "Bataayi gayi date: 6 Nov 2026. Us din caresults.icai.org par dekho.", "CA Intermediate September 2026 result declared": "CA Intermediate September 2026 ka result aa gaya", "Reported as declared on 22 Oct 2026.": "22 Oct 2026 ko aaya bataya gaya.", "Taken from news sites and the ICAI schedule saved in this app, so it can be late or wrong. Always confirm on icai.org.": "Ye news sites aur app me saved ICAI schedule se liya gaya hai, isliye late ya galat ho sakta hai. Hamesha icai.org par confirm karo.", "Fill automatically with AI": "AI se apne aap bharo", "Copy the text of one old ICAI question paper from the PDF and paste it here. The AI reads each question, picks the chapter and counts the marks. You check the result before it is saved. Needs sign in. Use one paper at a time.": "Ek purane ICAI question paper ka text PDF se copy karke yahan paste karo. AI har sawal padhkar chapter chunta hai aur marks ginta hai. Save hone se pehle aap result check karoge. Sign in chahiye. Ek baar me ek hi paper.", "PH:Paste the question paper text here": "PH:Question paper ka text yahan paste karo", "Read the paper": "Paper padho", "Reading the paper...": "Paper padh raha hai...", "Check this before you add it": "Jodne se pehle ise check karo", "The AI can make mistakes. If the numbers look wrong, discard them and add the marks by hand.": "AI galti kar sakta hai. Numbers galat lagein to hata do aur marks haath se daalo.", "Add these marks": "Ye marks jodo", "Paste the full text of the question paper": "Question paper ka poora text paste karo", "Marks added": "Marks jud gaye", "The AI function is not reachable. Has it been deployed?": "AI function nahi mil raha. Kya deploy hua hai?", "The AI answer could not be read. Try again, or add the marks by hand.": "AI ka jawab padha nahi ja saka. Dobara try karo ya marks haath se daalo.", "Latest news from news sites": "News sites ki taaza khabarein", "Headlines from news sites, not from ICAI. Open the link and confirm on icai.org.": "Ye news sites ki headlines hain, ICAI ki nahi. Link kholo aur icai.org par confirm karo.", "Dates are taken from news sites and the ICAI schedule saved in this app, so they can be late or wrong. Always confirm on icai.org.": "Dates news sites aur app me saved ICAI schedule se li gayi hain, isliye late ya galat ho sakti hain. Hamesha icai.org par confirm karo.", "Upload the paper (PDF or photo/scan)": "Paper upload karo (PDF ya photo/scan)", "One old ICAI paper. PDF or clear photos of each page. Max about 4 MB in total.": "Ek purana ICAI paper. PDF ya har page ki saaf photo. Total max lagbhag 4 MB.", "Read the file": "File padho", "Or copy the text of one old ICAI question paper from the PDF and paste it here. The AI reads each question, picks the chapter and counts the marks. You check the result before it is saved. Needs sign in. Use one paper at a time.": "Ya PDF se ek purane ICAI paper ka text copy karke yahan paste karo. AI har question padhkar chapter chunta hai aur marks ginta hai. Save hone se pehle tum result check karoge. Sign in chahiye. Ek baar me ek paper.", "Choose a PDF or photo first": "Pehle PDF ya photo chuno", "Choose at most 6 files": "Maximum 6 files chuno", "Only PDF, JPG, PNG or WEBP files": "Sirf PDF, JPG, PNG ya WEBP files", "Files are too big (max about 4 MB in total). Use fewer pages or a smaller PDF.": "Files bahut badi hain (total max lagbhag 4 MB). Kam pages ya chhota PDF use karo.", "Th var LANGK='ca_studyos_lang',PATC=null;
function getLang(){try{var l=localStorage.getItem(LANGK);return l==='hg'||l==='hi'?l:'en';}catch(e){return 'en';}}
function trCore(c,L){
  var D=I18N[L];
  if(Object.prototype.hasOwnProperty.call(D,c))return D[c];
  if(!PATC)PATC=I18N.pat.map(function(p){return [new RegExp(p[0]),p[1],p[2]];});
  for(var i=0;i<PATC.length;i++){
    var m=c.match(PATC[i][0]);
    if(m){var t=L==='hg'?PATC[i][1]:PATC[i][2];return t.replace(/\$(\d)/g,function(x,n){return m[n]===undefined?'':m[n];});}
  }
  if(c.indexOf(' • ')>0){
    var ps=c.split(' • '),ch=false,o=ps.map(function(p){var r=trCore(p,L);if(r!==p)ch=true;return r;});
    if(ch)return o.join(' • ');
  }
  if(/^[.,;] /.test(c)){var rr=trCore(c.slice(2),L);if(rr!==c.slice(2))return c.slice(0,2)+rr;}
  var ks=Object.keys(D);
  for(var j=0;j<ks.length;j++){var k=ks[j];if(k.length>=10&&c.length>k.length&&c.indexOf(k)===0&&(c.charAt(k.length)===' '||c.charAt(k.length)===':'))return D[k]+' '+trCore(c.slice(k.length).replace(/^ /,''),L);}
  return c;
}
function tr(s){
  var L=getLang();if(L==='en'||!s)return s;
  var m=String(s).match(/^(\s*)([\s\S]*?)(\s*)$/);if(!m[2])return s;
  var r=trCore(m[2],L);return r===m[2]?s:m[1]+r+m[3];
}
function applyLang(root){
  if(getLang()==='en'||!root)return;
  try{
    var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null),n,list=[];
    while((n=w.nextNode()))list.push(n);
    list.forEach(function(nd){var p=nd.parentNode;if(!p||/^(SCRIPT|STYLE|TEXTAREA)$/.test(p.tagName))return;var r=tr(nd.nodeValue);if(r!==nd.nodeValue)nd.nodeValue=r;});
    root.querySelectorAll('[placeholder]').forEach(function(e){var v='PH:'+e.getAttribute('placeholder'),r=tr(v);if(r!==v)e.setAttribute('placeholder',r.replace(/^PH:/,''));});
    root.querySelectorAll('[title]').forEach(function(e){var raw=e.getAttribute('title'),r=tr(raw);if(r===raw){var v='TI:'+raw;r=tr(v);if(r===v)return;r=r.replace(/^TI:/,'');}e.setAttribute('title',r);});
  }catch(e){}
}

function fmtMin(m){var h=Math.floor(m/60),x=m%60;return (h?h+'h ':'')+(x||!h?x+'m':'');}

function aLabel(i){return ['Jan','May','Sep'][i%3]+' '+Math.floor(i/3);}

function sylDiff(P){
  var add=0,rem=0,mig=0;
  Object.keys(P.papers).forEach(function(k){
    var have={};P.papers[k].ch.forEach(function(x){have[x.name.toLowerCase()]=1;});

      if(SUB[nm]){if(have[nm.toLowerCase()])mig++;SUB[nm].forEach(function(u){if(!have[(nm+' › '+u).toLowerCase()])add++;});}
      else if(!have[nm.toLowerCase()])add++;
    });
    (SYLREM[k]||[]).forEach(function(nm){P.papers[k].ch.forEach(function(x){if((x.name.toLowerCase()===nm.toLowerCase()||(x.grp||'').toLowerCase()===nm.toLowerCase())&&!x.removed)rem++;});});
  });

}
function applySyl(P){
  var added=0,removed=0,flagged=0;
  Object.keys(P.papers).forEach(function(k){
    var Lc=P.papers[k].ch,have={};Lc.forEach(function(x){have[x.name.toLowerCase()]=1;});
    (SYL[k]||[]).forEach(function(nm){
      if(SUB[nm]){
        var idx=-1;Lc.forEach(function(x,i){if(x.name===nm)idx=i;});
        var st='todo',old=null;
        if(idx>=0){old=Lc[idx];st=old.status;Lc.splice(idx,1);}
        var items=SUB[nm].filter(function(u){return !have[(nm+' › '+u).toLowerCase()];}).map(function(u){var c=mkCh(nm,u,st);if(old&&st==='done'){c.doneOn=old.doneOn;c.revs=old.revs||[];c.conf=old.conf||3;}return c;});
        Array.prototype.splice.apply(Lc,[idx>=0?idx:Lc.length,0].concat(items));added+=items.length;
      }else if(!have[nm.toLowerCase()]){Lc.push({id:uid(),name:nm,status:'todo',conf:3,revs:[]});added++;}
    });
    (SYLREM[k]||[]).forEach(function(nm){
      for(var i=Lc.length-1;i>=0;i--){
        var x=Lc[i];
        if(x.name.toLowerCase()===nm.toLowerCase()||(x.grp||'').toLowerCase()===nm.toLowerCase()){
          if(x.status==='todo'){Lc.splice(i,1);removed++;}else if(!x.removed){x.removed=true;flagged++;}
        }
      }
    });
  });
  P.sylVer=SYLVER;
  return {added:added,removed:removed,flagged:flagged};
}

function streakDays(P){

function weakChapters(P,study,n){
  var out=[];
  study.forEach(function(k){
    P.papers[k].ch.forEach(function(ch){
      if(ch.removed)return;
      var sc=0,why=[];
      if(ch.status!=='todo'&&ch.conf<=2){sc+=3-ch.conf;why.push('low confidence');}
      var mis=0,low=0;
      P.sessions.forEach(function(s){if(s.paper===k&&s.chapter===ch.name){if(s.mistakes)mis++;if(s.rating&&s.rating<=2)low++;}});
      if(mis){sc+=mis;why.push(mis+' mistake note'+(mis>1?'s':''));}
      if(low){sc+=low;why.push('understood poorly');}
      if(sc>0)out.push({k:k,ch:ch,sc:sc,why:why.join(', ')});
    });
  });
  return out.sort(function(a,b){return b.sc-a.sc;}).slice(0,n||5);
}

/* ---------- results analysis + exemption ---------- */
function analyse(P){
  var L=LEVELS[P.level];
  var att=P.attempts.slice().sort(function(a,b){return a.date<b.date?-1:(a.date>b.date?1:0);});
  var ex={},passed={},rows=[];
  att.forEach(function(a){
    var idx=aIdx(parse(a.date)),row={a:a,groups:[]};
    Object.keys(L.groups).forEach(function(g){
      if(passed[g])return;
      var G=L.groups[g],eff={},real=0,miss=[];
      G.p.forEach(function(k){
        var m=a.marks[k];
        if(typeof m==='number'&&!isNaN(m)){eff[k]=m;real++;}
        else if(ex[k]&&ex[k].exp>=idx){eff[k]=ex[k].mark;}
        else miss.push(k);
      });
      if(!real)return;
      var sum=0,low=[];
      G.p.forEach(function(k){if(eff[k]!==undefined){sum+=eff[k];if(eff[k]<40)low.push(k);}});
      var max=G.p.length*100;
      var pass=miss.length===0&&low.length===0&&sum>=max*0.5;
      var gr={g:g,n:G.n,pass:pass,sum:sum,max:max,miss:miss,low:low,aggFail:miss.length===0&&sum<max*0.5,newEx:[]};
      if(pass){passed[g]={label:a.label,idx:idx};}
      else if(miss.length===0&&L.exempt){
        G.p.forEach(function(k){
          var m=a.marks[k];
          if(typeof m==='number'&&m>=60&&!(ex[k]&&ex[k].exp>=idx)){ex[k]={mark:m,exp:idx+3,from:a.label};gr.newEx.push(k);}
        });
      }
      row.groups.push(gr);
    });
    rows.push(row);
  });
  return {rows:rows,ex:ex,passed:passed};
}
function activeInfo(P,A){
  var L=LEVELS[P.level],tIdx=aIdx(parse(P.examDate)),groups=[],study=[],exempt=[];
  P.groups.forEach(function(g){
    var G=L.groups[g];if(!G)return;
    if(A.passed[g]){groups.push({g:g,n:G.n,p:G.p,passed:A.passed[g].label});return;}
    var exs=G.p.filter(function(k){return A.ex[k]&&A.ex[k].exp>=tIdx;});
    var rest=G.p.filter(function(k){return exs.indexOf(k)<0;});
    var sumEx=exs.reduce(function(s,k){return s+A.ex[k].mark;},0);
    var need=Math.max(rest.length*40,G.p.length*50-sumEx);
    groups.push({g:g,n:G.n,p:G.p,exs:exs,rest:rest,need:need,avg:rest.length?need/rest.length:0});
    exempt=exempt.concat(exs);study=study.concat(rest);
  });
  return {groups:groups,study:study,exempt:exempt,tIdx:tIdx};
}


/* ---------- journey: earlier-level marks, route, unlock ---------- */
var PRIOR={IN1:['FD1'],IN2:['FD2'],IN6:['FD3'],FN1:['IN1'],FN2:['IN6'],FN3:['IN5'],FN4:['IN3'],FN5:['IN3']};
function histLevel(P){return P.level==='inter'?'foundation':(P.level==='final'?'inter':null);}
function priorScore(P,k){
  var src=PRIOR[k],best=null;if(!src||!P.hist)return null;
  src.forEach(function(sk){var lv=sk.slice(0,2)==='FD'?'foundation':'inter';(P.hist[lv]||[]).forEach(function(a){var m=a.marks&&a.marks[sk];if(typeof m==='number'&&(!best||a.date>=best.d))best={d:a.date,v:m};});});
  return best?best.v:null;
}
function histA(hist,lvl){return analyse({level:lvl,attempts:(hist&&hist[lvl])||[]});}
function directOK(type,pct){
  var p=Number(pct);
  if(type==='prof')return {ok:true,msg:'Qualified CA/CS/CMA: eligible for direct entry.'};
  if(type==='commerce')return p>=55?{ok:true,msg:'Commerce graduate/PG with '+p+'%: eligible (needs 55%).'}:{ok:false,msg:'Commerce graduates need at least 55%. Foundation route is the way.'};
  if(type==='other')return p>=60?{ok:true,msg:'Non-commerce graduate/PG with '+p+'%: eligible (needs 60%).'}:{ok:false,msg:'Other graduates need at least 60%. Foundation route is the way.'};
  return {ok:false,msg:'Direct entry needs a graduation/PG degree (or CS/CMA). Otherwise start with Foundation.'};
}
function canStart(o){
  if(o.level==='foundation')return {ok:true,msg:''};
  if(o.level==='inter'){
    if(o.route==='direct'){var d=directOK(o.gtype,o.gpct);return {ok:d.ok,msg:d.msg+(d.ok?' Confirm on icai.org before registering.':'')};}
    var A=histA(o.hist,'foundation');
    return A.passed.ALL?{ok:true,msg:'Foundation passed ('+A.passed.ALL.label+'). Intermediate is open.'}:{ok:false,msg:'Intermediate opens after you pass Foundation. Add your Foundation attempt marks below, or choose Direct entry if you are a graduate.'};
  }
  var B=histA(o.hist,'inter');
  if(o.confirmInter||(B.passed.G1&&B.passed.G2))return {ok:true,msg:'Final is open.'};
  return {ok:false,msg:'Final opens after you pass both Intermediate groups. Add your Intermediate marks below or tick the box.'};
}

/* ---------- scores, hours, weakness ---------- */
function lastScore(P,k){
  var best=null;
  P.attempts.forEach(function(a){var m=a.marks[k];if(typeof m==='number'&&(!best||a.date>=best.d))best={d:a.date,v:m};});
  P.mocks.forEach(function(m){if(m.paper===k&&m.max>0){var v=m.score/m.max*100;if(!best||m.date>=best.d)best={d:m.date,v:v};}});
  return best?best.v:null;
}
function weak(P,k){var v=lastScore(P,k);if(v===null){var pv=priorScore(P,k);if(pv===null)return 0.3;return clamp((P.target-(pv-5))/P.target,0,1);}return clamp((P.target-v)/P.target,0,1);}
function hoursDone(P,k){return P.sessions.filter(function(s){return s.paper===k&&s.date>=P.planStart;}).reduce(function(t,s){return t+s.min;},0)/60;}
function remH(P,k){return Math.max(0,P.papers[k].h-hoursDone(P,k));}

/* ---------- plan engine ---------- */
function planInfo(P,A,X){
  var t=today(),ex=parse(P.examDate),days=diff(t,ex);
  var dd=Math.max(days,0);
  var revDays=dd>45?Math.max(20,Math.round(dd*0.25)):Math.round(dd*0.4);
  var mockDays=Math.min(15,Math.round(dd*0.15));
  var phase=days<0?'over':(days<=mockDays?'mock':(days<=revDays?'revise':'learn'));
  var learnLeft=Math.max(0,days-revDays);
  var rem=X.study.reduce(function(s,k){return s+remH(P,k);},0);
  var avail=learnLeft*(P.rest>=0?6/7:1);
  var need=avail>0?rem/avail:(rem>0?Infinity:0);
  var status=rem===0?'done':(need<=P.dailyHours*0.95?'ontrack':(need<=P.dailyHours*1.2?'tight':'behind'));
  return {t:t,ex:ex,days:days,revDays:revDays,mockDays:mockDays,phase:phase,learnLeft:learnLeft,rem:rem,need:need,status:status};
}
function weights(P,X,phase,remMap){
  var w={};
  X.study.forEach(function(k){
    var wk=weak(P,k),f=P.papers[k].focus,r=remMap?remMap[k]:remH(P,k);
    if(phase==='learn')w[k]=r>0?r*(1+wk*0.6+(f?0.5:0)):0;
    else w[k]=(1+wk*1.5+(f?0.4:0))*(1+(r/Math.max(1,P.papers[k].h))*0.5);
  });
  return w;
}
function allocate(total,w){
  var ks=Object.keys(w).filter(function(k){return w[k]>0;});
  if(!ks.length||total<=0)return {};
  var sum=ks.reduce(function(s,k){return s+w[k];},0),out={},used=0;
  ks.forEach(function(k){out[k]=Math.floor(total*w[k]/sum/15)*15;used+=out[k];});
  var left=total-used,order=ks.slice().sort(function(a,b){return w[b]-w[a];}),i=0;
  while(left>=15){out[order[i%order.length]]+=15;left-=15;i++;}
  ks.forEach(function(k){if(k!==order[0]&&out[k]>0&&out[k]<30){out[order[0]]+=out[k];out[k]=0;}});
  return out;

function why(P,k,phase){
  var r=[],lv=lastScore(P,k);
  if(lv!==null)r.push('last score '+Math.round(lv)+'/100');
  else{var pv=priorScore(P,k);if(pv!==null)r.push('earlier level, related subject: '+Math.round(pv)+'/100');}
  if(P.papers[k].focus)r.push('focus paper');
  if(phase==='learn')r.push(Math.round(remH(P,k))+' hrs of syllabus left');
  else r.push(phase==='mock'?'exam is close: practice and fix mistakes':'revision phase');
  return r.join(' \u2022 ');
}
function revDue(P,t){
  var out=[],ts=iso(t);
  Object.keys(P.papers).forEach(function(k){P.papers[k].ch.forEach(function(c){(c.revs||[]).forEach(function(r){if(!r.done&&r.due<=ts)out.push({k:k,c:c,r:r});});});});
  return out.sort(function(a,b){return a.r.due<b.r.due?-1:(a.r.due>b.r.due?1:0);});
}
function todayPlan(c){
  var P=c.P,X=c.X,I=c.I,t=I.t,rv=revDue(P,t),blocks=[];
  if(P.rest>=0&&t.getDay()===P.rest)return {rest:true,blocks:[],rv:rv};
  var mins=Math.round(P.dailyHours*60*(P.lightDay===iso(t)?0.5:1));
  if(!X.study.length||I.phase==='over')return {rest:false,blocks:[],rv:rv};
  var revMin=Math.min(rv.length*20,Math.round(mins*0.35/5)*5);
  if(rv.length&&revMin>0){
    var by={};rv.forEach(function(x){by[x.k]=(by[x.k]||0)+1;});
    var scale=revMin/(rv.length*20);
    Object.keys(by).forEach(function(k){
      var m=Math.max(10,Math.round(by[k]*20*scale/5)*5);
      blocks.push({k:k,type:'Revision',min:m,reason:by[k]+' chapter(s) due for spaced revision'});
    });
  }
  var left=mins-blocks.reduce(function(s,b){return s+b.min;},0);
  var w=weights(P,X,I.phase,null),phase=I.phase;
  if(phase==='mock'&&left>=120&&Math.floor(t.getTime()/864e5)%2===0){
    var top=Object.keys(w).sort(function(a,b){return w[b]-w[a];})[0];
    var mm=Math.min(180,Math.round(left*0.6/15)*15);
    blocks.push({k:top,type:'Timed mock / PYQ paper',min:mm,reason:'Write under exam conditions, then review every mistake'});
    left-=mm;
  }
  if(phase==='learn'){
    var dn=X.study.filter(function(k){return remH(P,k)<=0.5;}),lr=X.study.filter(function(k){return remH(P,k)>0.5;});
    if(dn.length&&lr.length){
      var rsv=Math.min(Math.round(left*0.15/15)*15,dn.length*45);
      if(rsv>=15){
        var dw={};dn.forEach(function(k){var lv=lastScore(P,k);dw[k]=(lv!==null&&lv>=60)?0.5:1;});
        var da=allocate(rsv,dw),used=0;
        Object.keys(da).forEach(function(k){if(da[k]>0){used+=da[k];var lv2=lastScore(P,k);blocks.push({k:k,type:'Revision only',min:da[k],reason:'Course finished: revise and solve PYQs'+(lv2!==null&&lv2>=60?' (light, you scored 60+)':'')});}});
        left-=used;
      }
    }
  }
  var al=allocate(left,w);
  Object.keys(al).filter(function(k){return al[k]>0;}).sort(function(a,b){return al[b]-al[a];}).forEach(function(k){
    blocks.push({k:k,type:phase==='learn'?'Study':(phase==='mock'?'Practice / PYQs':'Revise + practice'),min:al[k],reason:why(P,k,phase)});
  });
  return {rest:false,blocks:blocks,rv:rv};
}
function roadmap(c){
  var P=c.P,X=c.X,I=c.I,rem={},rows=[],doneOn=null;
  X.study.forEach(function(k){rem[k]=remH(P,k);});
  var d=I.t,wk=0;
  while(diff(d,I.ex)>=0&&wk<90){
    var end=addDays(d,6);if(end>I.ex)end=I.ex;
    var pc={},sd=0;
    for(var x=d;x<=end;x=addDays(x,1)){
      var dl=diff(x,I.ex),ph=dl<=I.mockDays?'mock':(dl<=I.revDays?'revise':'learn');
      pc[ph]=(pc[ph]||0)+1;
      if(!(P.rest>=0&&x.getDay()===P.rest))sd++;
    }
    var ph2=Object.keys(pc).sort(function(a,b){return pc[b]-pc[a];})[0];
    var hrs=sd*P.dailyHours,w=weights(P,X,ph2,rem),al=allocate(Math.round(hrs*60),w),out={};
    Object.keys(al).forEach(function(k){
      var m=ph2==='learn'?Math.min(al[k],Math.round(rem[k]*60)):al[k];
      if(m>0){out[k]=m;rem[k]=Math.max(0,rem[k]-m/60);}
    });
    var tot=Object.keys(rem).reduce(function(s,k){return s+rem[k];},0);
    if(doneOn===null&&tot<0.5)doneOn=end;
    rows.push({n:wk+1,start:d,end:end,ph:ph2,hrs:hrs,alloc:out});
    d=addDays(end,1);wk++;
  }
  return {rows:rows,doneOn:doneOn};
}

/* ---------- revisions ---------- */
function makeRevs(conf,from,exam){
  var base=[1,3,7,15,30],f=conf<=2?0.6:(conf>=4?1.3:1),out=[];
  base.forEach(function(b){
    var off=Math.max(1,Math.round(b*f)),dt=addDays(from,off);
    if(diff(dt,exam)>=1)out.push({id:uid(),due:iso(dt),done:false});
  });
  return out;
}

var MIS_STEPS=[3,7,21];
var MIS_CAUSE={concept:'Concept not clear',calc:'Calculation error',silly:'Silly mistake',time:'Ran out of time',forgot:'Forgot formula / section'};
function attemptOptions(P,A,X){
  var t=today(),base=aIdx(t),rem=X.study.reduce(function(s,k){return s+remH(P,k);},0),out=[];
  var started=P.sessions.length>0||Object.keys(P.papers).some(function(k){return P.papers[k].ch.some(function(c){return c.status!=='todo';});});
  var curI=aIdx(parse(P.examDate));
  for(var i=base;i<=base+3;i++){
    var lab=aLabel(i),e=CAL.attempts[lab],ic=icaiStart(P.level,P.groups,lab),ds=ic||iso(aDate(i)),days=diff(t,parse(ds));
    if(days<7)continue;
    var fl=e&&e.form&&e.form.last?parse(e.form.last):null,closed=!!(fl&&diff(t,fl)<0),fdays=fl?diff(t,fl):null;
    var lost=X.exempt.filter(function(k){return A.ex[k]&&A.ex[k].exp<i;});
    var r2=rem+lost.reduce(function(s,k){return s+P.papers[k].h;},0);
    var revD=days>45?Math.max(20,Math.round(days*0.25)):Math.round(days*0.4);
    var avail=Math.max(0,days-revD)*(P.rest>=0?6/7:1);
    var need=avail>0?r2/avail:(r2>0?Infinity:0);
    var st=closed?'closed':(need<=P.dailyHours*0.95?'ready':(need<=P.dailyHours*1.2?'tight':'short'));
    out.push({i:i,lab:lab,ds:ds,est:!ic,days:days,need:need,st:st,fdays:fdays,lost:lost,sel:i===curI});
  }
  var pick=null;
  ['ready','tight'].forEach(function(sx){if(!pick)out.forEach(function(o){if(!pick&&o.st===sx)pick=o;});});
  if(!pick){var open=out.filter(function(o){return o.st!=='closed';});pick=open[open.length-1]||null;}
  if(pick)pick.sug=true;
  return {rows:out,pick:pick,started:started};
}

var LOSS_KEYS=['concept','calc','silly','time','forgot'];
var LOSS_TIP={concept:'Re-learn the concept from your book, then solve 5 questions on it.',calc:'Do 10 calculation-only questions daily and check each step.',silly:'Re-read the question twice and underline what is asked before you answer.',time:'Practise with a timer: set a time limit for every question.',forgot:'Make formula and section cards (Log tab) and revise them daily.'};
function mockPct(m){return m.max>0?m.score/m.max*100:0;}
function mockCard(P){
  var ms=P.mocks.slice().sort(function(a,b){return a.date<b.date?-1:1;});
  if(!ms.length)return '';
  var h='<h2>Mock test analysis</h2><div class="card">';
  var last5=ms.slice(-5);
  h+='<div class="mut">Last '+last5.length+' mocks</div><div>'+last5.map(function(m){return plab(m.paper)+' '+Math.round(mockPct(m))+'%';}).join(' • ')+'</div>';
  var tot={},n=0,lostAll=0;
  ms.forEach(function(m){if(m.loss){n++;LOSS_KEYS.forEach(function(k){var v=Number(m.loss[k])||0;tot[k]=(tot[k]||0)+v;lostAll+=v;});}});
  if(n&&lostAll>0){
    var ks=LOSS_KEYS.slice().sort(function(a,b){return (tot[b]||0)-(tot[a]||0);});
    h+='<div style="margin-top:8px"><b>Where your marks went ('+n+' analysed mock'+(n>1?'s':'')+')</b></div>';
    ks.forEach(function(k){var v=tot[k]||0;if(!v)return;var pc=Math.round(v/lostAll*100);h+='<div class="row sp mut" style="margin-top:4px"><span>'+esc(MIS_CAUSE[k])+'</span><span>'+r1(v)+' marks ('+pc+'%)</span></div><div class="bar"><i style="width:'+pc+'%"></i></div>';});
    var top=ks[0];if(tot[top])h+='<div style="margin-top:8px">Biggest leak: <b>'+esc(MIS_CAUSE[top])+'</b>. '+esc(LOSS_TIP[top])+'</div>';
  }else h+='<div class="mut" style="margin-top:8px">Tap Analyse on a mock above and enter where you lost marks. The app will show your biggest leak.</div>';
  var by={};ms.forEach(function(m){(by[m.paper]=by[m.paper]||[]).push(mockPct(m));});
  h+='<div style="margin-top:8px" class="mut">Average by paper: '+Object.keys(by).map(function(k){var a=by[k];return plab(k)+' '+Math.round(a.reduce(function(x,y){return x+y;},0)/a.length)+'%';}).join(' • ')+'</div>';
  return h+'</div>';
}

function sessMins(P,from,to){return P.sessions.filter(function(s){return s.date>=iso(from)&&s.date<=iso(to);}).reduce(function(t,s){return t+s.min;},0);}

    '<div class="row sp" style="margin-top:10px"><span>This week</span><span>'+fmtMin(wk)+' / '+fmtMin(Math.round(wg))+'</span></div><div class="bar"><i style="width:'+clamp(wk/wg*100,0,100)+'%"></i></div>';

  }

function groupVerdict(g){
  if(g.pass)return '<span class="chip ok">Passed</span> '+g.n+': '+r1(g.sum)+'/'+g.max;
  var why=[];
  if(g.miss.length)why.push('absent in '+g.miss.map(plab).join(', ')+' (no exemption possible)');
  if(g.low.length)why.push('below 40 in '+g.low.map(plab).join(', '));
  if(g.aggFail)why.push('aggregate below 50%');
  return '<span class="chip bad">Not passed</span> '+g.n+': '+r1(g.sum)+'/'+g.max+(why.length?' \u2022 '+why.join('; '):'');
}

async function aiAsk(P){
  var a=ui.ai;a.mode=readv('ai-mode')||a.mode;a.q=readv('ai-q').trim();if(a.mode==='material')a.mat=readv('ai-mat');var cx=document.getElementById('ai-ctx');a.ctx=cx?cx.checked:a.ctx;
  if(!a.q){a.err='Type your question first';a.ans='';render();return;}
  if(a.mode==='material'&&!String(a.mat||'').trim()){a.err='Paste the text from your material first';a.ans='';render();return;}
  a.busy=true;a.err='';a.ans='';render();
  try{
    var r=await cloud.client.functions.invoke('ai-tutor',{body:{lang:getLang(),mode:a.mode,question:a.q,context:a.mode==='material'?'':(a.ctx?aiContext(P):''),material:a.mode==='material'?String(a.mat||'').slice(0,6000):''}});
    if(r.error){
      var msg='The AI function is not reachable. Has it been deployed? (see the setup guide)';
      try{if(r.error.context&&r.error.context.json){var j=await r.error.context.json();if(j&&j.error)msg=j.error;}}catch(e){}
      throw new Error(msg);
    }
    if(r.data&&r.data.error)throw new Error(r.data.error);
    a.ans=(r.data&&r.data.answer)||'No answer came back.';
  }catch(e){a.err=(e&&e.message)||'Something went wrong';}
  a.busy=false;render();
}

function readv(id){var e=document.getElementById(id);return e?e.value:'';}
function guard(p){return p.catch(function(e){toast((e&&e.message)?e.message:'Something went wrong');});}
function cact(a,d){
  if(a==='cloudsave'){
    var url=readv('cl-url').trim().replace(/\/(rest|auth|functions|storage)\/v1.*$/i,'').replace(/\/+$/,''),key=readv('cl-key').trim(),err=validateCfg(url,key);
    if(err){cmsg(err,'bad');render();return true;}
    cloud.cfg={url:url,key:key};
    try{localStorage.setItem(CKEY,JSON.stringify(cloud.cfg));}catch(e){}
    cmsg('Saved. Now create an account or sign in.','ok');initCloud();render();return true;
  }
  if(a==='cloudclear'){
    if(confirm('Disconnect the cloud? Your data stays on this device.')){
      if(cloud.client)cloud.client.auth.signOut().catch(function(){});
      cloud.cfg=null;try{localStorage.removeItem(CKEY);}catch(e){}
      cloud.user=null;cloud.client=null;cloud.state='off';cloud.links=[];cloud.partner=null;cloud.psums={};cloud.isAdmin=false;cloud.icai=null;cloud.icaiLoaded=false;cloud.aIds=[];cloud.aStats=null;cloud.aPapers=[];cloud.pending=[];cmsg('');render();
    }
    return true;
  }
  if(a==='signin'||a==='signup'){
    var em=readv('cl-email').trim(),pw=readv('cl-pw');
    if(!em||!pw){cmsg('Enter your email and password','bad');render();return true;}
    if(a==='signup'&&pw.length<6){cmsg('Password must be at least 6 characters','bad');render();return true;}
    doAuth(a==='signup'?'up':'in',em,pw);return true;
  }
  if(a==='signout'){
    if(cloud.client)cloud.client.auth.signOut().then(function(){cmsg('Signed out. Your data stays on this device.','ok');render();});
    return true;
  }
  if(a==='syncnow'){guard(syncAll().then(refreshPartner));return true;}
  if(a==='invite'){
    var e1=readv('pt-email').trim();
    guard(rpc('invite_partner',{p_email:e1}).then(function(m){toast(m);return refreshPartner();}));return true;
  }
  if(a==='respond'){
    guard(rpc('respond_invite',{p_link:d.l,p_accept:d.ok==='1'}).then(function(m){toast(m);return refreshPartner();}));return true;
  }
  if(a==='revoke'){
    if(confirm('Remove this connection? Sharing stops immediately for both of you.')){
      if(cloud.partner&&cloud.partner.link===d.l)cloud.partner=null;
      guard(rpc('revoke_link',{p_link:d.l}).then(function(m){toast(m);return refreshPartner();}));
    }
    return true;
  }
  if(a==='viewp'){
    guard(refreshPartner());return true;
  }
  if(a==='closep'){return true;}
  if(a==='shareall'){
    var on=d.on==='1',row2={link_id:d.l,owner:cloud.user.id};PREFS.forEach(function(p){row2[p[0]]=on;});
    guard(cloud.client.from('share_prefs').upsert(row2,{onConflict:'link_id,owner'}).then(function(r){if(r.error)throw r.error;return pushSummary();}).then(function(){toast(on?'Sharing on':'Sharing off');return refreshPartner();}));
    return true;
  }
  if(a==='calcheck'||a==='calpaste'){
    var cbody={};
    if(a==='calpaste'){var tx=readv('cal-text').trim();if(tx.length<30){toast('Paste the ICAI notice text first');return true;}cbody={text:tx};}
    guard(cloud.client.functions.invoke('icai-check',{body:cbody}).then(async function(r){
      if(r.error){
        var msg='The ICAI check function is not reachable. Check it is deployed with the name icai-check.';
        try{if(r.error.context&&r.error.context.json){var jj=await r.error.context.json();if(jj&&jj.error)msg=jj.error;}}catch(e){}
        throw new Error(msg);
      }
      var m=(r.data&&(r.data.message||r.data.error))||'Done';toast(m);return refreshPartner();
    }));return true;
  }
  if(a==='calok'||a==='calno'){
    guard(rpc(a==='calok'?'approve_calendar':'reject_calendar',{p_id:d.id}).then(function(m){toast(m);return fetchRemote().then(refreshPartner);}));return true;
  }
  if(a==='addgoal'){
    var title=readv('gt-'+d.l).trim(),kind=readv('gk-'+d.l),target=Number(readv('gn-'+d.l)),end=readv('ge-'+d.l);
    if(!title||!(target>0)||!end||end<iso(today())){toast('Enter a title, a target above 0 and an end date that is not in the past');return true;}
    guard(cloud.client.from('shared_goals').insert({link_id:d.l,title:title.slice(0,120),kind:kind,target:target,start_date:iso(today()),end_date:end}).then(function(r){
      if(r.error)throw r.error;toast('Goal created');return updateMyProgress().then(refreshPartner);
    }));return true;
  }
  if(a==='goalsave'){
    var v=Number(readv('gv-'+d.g));
    if(!(v>=0)){toast('Enter a number');return true;}
    guard(cloud.client.from('goal_progress').upsert({goal_id:d.g,user_id:cloud.user.id,value:v},{onConflict:'goal_id,user_id'}).then(function(r){
      if(r.error)throw r.error;toast('Saved');return refreshPartner();
    }));return true;
  }
  if(a==='goalarch'){
    if(confirm('Archive this goal for both of you?')){
      guard(cloud.client.from('shared_goals').update({status:'archived'}).eq('id',d.g).then(function(r){
        if(r.error)throw r.error;return refreshPartner();
      }));
    }
    return true;
  }
  return false;
}
function cchg(k,d,el){
  if(k==='shareprof'){S.shareId=el.value;save();guard(pushSummary().then(updateMyProgress).then(refreshPartner));return true;}
  if(k==='pref'){
    var row={link_id:d.l,owner:cloud.user.id};
    document.querySelectorAll('[data-chg="pref"]').forEach(function(b){if(b.dataset.l===d.l)row[b.dataset.f]=b.checked;});
    guard(cloud.client.from('share_prefs').upsert(row,{onConflict:'link_id,owner'}).then(function(r){
      if(r.error)throw r.error;return pushSummary();
    }).then(function(){toast('Sharing updated');return refreshPartner();}));
    return true;
  }
  return false;
}

function nextSuggestion(P,s){
  if(s.rating&&s.rating<=2)return 'You rated this '+s.rating+'/5. Redo the confusing parts tomorrow and solve about 10 questions on it before moving on.';
  if(s.pending)return 'You noted pending work: '+s.pending+'. Clear it first in your next session.';
  var A=analyse(P),X=activeInfo(P,A),I=planInfo(P,A,X),w=weights(P,X,I.phase,null);
  var top=Object.keys(w).filter(function(k){return k!==s.paper;}).sort(function(a,b){return w[b]-w[a];})[0]||s.paper;
  return 'Next suggested paper: '+pfull(top)+' ('+why(P,top,I.phase)+').';
}
function getCh(P,k,id){var l=P.papers[k]?P.papers[k].ch:[];for(var i=0;i<l.length;i++)if(l[i].id===id)return l[i];return null;}

function chNeedMin(P,k){var n=P.papers[k].ch.filter(function(x){return !x.removed;}).length||1;return clamp(Math.round(P.papers[k].h*60/n*0.5/5)*5,15,90);}

function canTick(P,k,ch){
  if(P.verify===false)return {ok:true,more:0};
  var need=chNeedMin(P,k),have=chTimerMin(P,k,ch);

function chg(k,d,el){
